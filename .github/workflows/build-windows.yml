name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fetch Remote Server Dependencies
        shell: bash
        run: |
          mkdir -p build/remote
          dart run tool/fetch_remote_server.dart || true

      - name: Build Windows Application
        shell: pwsh
        run: |
          dart run tool/build_windows.dart --arch x64

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeBuddy-IDE-Windows-x64
          path: build/installers/*.exe
          if-no-files-found: error

